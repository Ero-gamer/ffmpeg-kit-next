name: Build FFmpegKit Next Android armeabi-v7a

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "9.0.1"
  NDK_VERSION: "27.2.12479018"         # r27d
  ANDROID_API: "24"
  ABI: "armeabi-v7a"
  ARMV7_BUILD_PATH: "android-24-arm-v7a"
  ARMV7_NEON_BUILD_PATH: "android-24-arm-v7a-neon"
  OPT_CFLAGS: >-
    -O3 -ffast-math -ftree-vectorize
    -mfloat-abi=softfp -mfpu=neon-vfpv4
    -march=armv7-a -fPIC
  NEON_CFLAGS: >-
    -O3 -ffast-math -ftree-vectorize
    -mfloat-abi=softfp -mfpu=neon-vfpv4
    -march=armv7-a -fPIC -marm

jobs:
  build-ffmpegkit-android:
    name: Build FFmpegKit Next (armeabi-v7a full)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install NDK r27d
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm yasm pkg-config autoconf automake libtool \
            cmake git curl ca-certificates libssl-dev python3

      - name: Cache FFmpeg tarball
        uses: actions/cache@v6.1.0
        with:
          path: ffmpeg-${{ env.FFMPEG_VERSION }}.tar.bz2
          key: ffmpeg-tarball-${{ env.FFMPEG_VERSION }}

      - name: Download FFmpeg ${{ env.FFMPEG_VERSION }}
        run: |
          if [ ! -f "ffmpeg-${{ env.FFMPEG_VERSION }}.tar.bz2" ]; then
            curl -sLO "https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.bz2"
          fi

      - name: Set toolchain environment
        run: |
          HOST_TAG="linux-x86_64"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST_TAG"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "CC_ARMV7=$TOOLCHAIN/bin/armv7a-linux-androideabi${{ env.ANDROID_API }}-clang" >> $GITHUB_ENV
          echo "CXX_ARMV7=$TOOLCHAIN/bin/armv7a-linux-androideabi${{ env.ANDROID_API }}-clang++" >> $GITHUB_ENV
          echo "CROSS_PREFIX=$TOOLCHAIN/bin/llvm-" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV

      - name: Build FFmpeg plain ARMv7-A
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_BUILD_PATH }}/ffmpeg"
          mkdir -p "$OUT_DIR"

          tar xjf "ffmpeg-${{ env.FFMPEG_VERSION }}.tar.bz2"
          mv "ffmpeg-${{ env.FFMPEG_VERSION }}" "ffmpeg-${{ env.FFMPEG_VERSION }}-plain"
          cd "ffmpeg-${{ env.FFMPEG_VERSION }}-plain"

          ./configure \
            --prefix="$OUT_DIR" \
            --target-os=android \
            --arch=arm \
            --cpu=armv7-a \
            --cc="${{ env.CC_ARMV7 }}" \
            --cxx="${{ env.CXX_ARMV7 }}" \
            --cross-prefix="${{ env.CROSS_PREFIX }}" \
            --sysroot="${{ env.SYSROOT }}" \
            --enable-shared \
            --disable-static \
            --enable-pic \
            --enable-neon \
            --enable-asm \
            --enable-inline-asm \
            --enable-jni \
            --enable-mediacodec \
            --enable-hwaccels \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-avfilter \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-protocols \
            --enable-encoders \
            --enable-decoders \
            --enable-demuxers \
            --enable-muxers \
            --enable-filters \
            --enable-bsfs \
            --enable-indevs \
            --enable-outdevs \
            --enable-network \
            --enable-ffmpeg \
            --disable-ffprobe \
            --disable-ffplay \
            --disable-small \
            --disable-debug \
            --disable-doc \
            --extra-cflags="${{ env.OPT_CFLAGS }}" \
            --extra-ldflags="-L$OUT_DIR/lib"

          make -j$(nproc)
          make install

      - name: Build FFmpeg NEON ARMv7-A
        run: |
          set -e
          NEON_TMP="$GITHUB_WORKSPACE/prebuilt/tmp-neon/ffmpeg"
          NEON_OUT="$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/ffmpeg"
          mkdir -p "$NEON_TMP" "$NEON_OUT/lib" "$NEON_OUT/include"

          tar xjf "ffmpeg-${{ env.FFMPEG_VERSION }}.tar.bz2"
          mv "ffmpeg-${{ env.FFMPEG_VERSION }}" "ffmpeg-${{ env.FFMPEG_VERSION }}-neon"
          cd "ffmpeg-${{ env.FFMPEG_VERSION }}-neon"

          ./configure \
            --prefix="$NEON_TMP" \
            --target-os=android \
            --arch=arm \
            --cpu=armv7-a \
            --cc="${{ env.CC_ARMV7 }}" \
            --cxx="${{ env.CXX_ARMV7 }}" \
            --cross-prefix="${{ env.CROSS_PREFIX }}" \
            --sysroot="${{ env.SYSROOT }}" \
            --enable-shared \
            --disable-static \
            --enable-pic \
            --enable-neon \
            --enable-asm \
            --enable-inline-asm \
            --enable-jni \
            --enable-mediacodec \
            --enable-hwaccels \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-avfilter \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-protocols \
            --enable-encoders \
            --enable-decoders \
            --enable-demuxers \
            --enable-muxers \
            --enable-filters \
            --enable-bsfs \
            --enable-indevs \
            --enable-outdevs \
            --enable-network \
            --enable-ffmpeg \
            --disable-ffprobe \
            --disable-ffplay \
            --disable-small \
            --disable-debug \
            --disable-doc \
            --extra-cflags="${{ env.NEON_CFLAGS }}" \
            --extra-ldflags="-L$NEON_TMP/lib"

          make -j$(nproc)
          make install

          cp -r "$NEON_TMP/include/." "$NEON_OUT/include/"
          for LIB in avcodec avfilter avdevice avformat avutil swresample swscale; do
            SO=$(ls "$NEON_TMP/lib/lib${LIB}.so" 2>/dev/null || true)
            if [ -n "$SO" ]; then
              cp "$SO" "$NEON_OUT/lib/lib${LIB}_neon.so"
            fi
            for F in "$NEON_TMP/lib/lib${LIB}".so*; do
              [ -f "$F" ] && cp -d "$F" "$NEON_OUT/lib/" 2>/dev/null || true
            done
          done

      - name: Fetch and Build cpu-features (libndk_compat.a)
        run: |
          set -e
          CPU_OUT="$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_BUILD_PATH }}/cpu-features"
          mkdir -p "$CPU_OUT/lib" "$CPU_OUT/include/ndk_compat" /tmp/cpufeatures

          curl -sSL "https://android.googlesource.com/platform/ndk/+/refs/heads/main/sources/android/cpufeatures/cpu-features.c?format=TEXT" | base64 -d > /tmp/cpufeatures/cpu-features.c
          curl -sSL "https://android.googlesource.com/platform/ndk/+/refs/heads/main/sources/android/cpufeatures/cpu-features.h?format=TEXT" | base64 -d > /tmp/cpufeatures/cpu-features.h

          "${{ env.CC_ARMV7 }}" \
            -O3 -fPIC \
            -march=armv7-a -mfloat-abi=softfp -mfpu=neon-vfpv4 \
            -I/tmp/cpufeatures \
            -c /tmp/cpufeatures/cpu-features.c \
            -o /tmp/cpu-features.o

          "${{ env.TOOLCHAIN }}/bin/llvm-ar" rcs "$CPU_OUT/lib/libndk_compat.a" /tmp/cpu-features.o
          cp /tmp/cpufeatures/cpu-features.h "$CPU_OUT/include/ndk_compat/"

          mkdir -p "$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/cpu-features/lib"
          mkdir -p "$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/cpu-features/include/ndk_compat"
          cp "$CPU_OUT/lib/libndk_compat.a" "$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/cpu-features/lib/"
          cp /tmp/cpufeatures/cpu-features.h "$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/cpu-features/include/ndk_compat/"

      - name: Generate Application.mk and build.mk
        run: |
          cat > android/jni/Application.mk << 'APPMK'
          APP_ABI         := armeabi-v7a
          APP_PLATFORM    := android-24
          APP_STL         := c++_shared
          APP_OPTIM       := release
          APP_ARM_MODE    := arm
          APPMK

          cat > android/jni/build.mk << BUILDMK
          ARMV7_BUILD_PATH      := ${{ env.ARMV7_BUILD_PATH }}
          ARMV7_NEON_BUILD_PATH := ${{ env.ARMV7_NEON_BUILD_PATH }}
          ARM64_BUILD_PATH      :=
          X86_BUILD_PATH        :=
          X86_64_BUILD_PATH     :=
          ARMV7                 := true
          ARMV7_NEON            := true
          FFMPEG_KIT_PACKAGE_NAME_CFLAG := -DFFMPEGKIT_PACKAGE="full"
          BUILDMK

      - name: Build JNI (ndk-build)
        run: |
          set -e
          LIBS_DIR="$GITHUB_WORKSPACE/android/libs/armeabi-v7a"
          mkdir -p "$LIBS_DIR"

          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/android" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/android/jni/Application.mk" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/android/libs" \
            NDK_OUT="$GITHUB_WORKSPACE/android/obj" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/android/jni/Android.mk" \
            -j$(nproc) \
            ARMV7=true \
            ARMV7_NEON=true \
            V=0

      - name: Assemble jniLibs
        run: |
          set -e
          JNI_LIBS="$GITHUB_WORKSPACE/android/libs/armeabi-v7a"

          PLAIN_LIB="$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_BUILD_PATH }}/ffmpeg/lib"
          for SO in "$PLAIN_LIB"/*.so; do
            [ -L "$SO" ] && continue
            cp "$SO" "$JNI_LIBS/"
          done

          NEON_LIB="$GITHUB_WORKSPACE/prebuilt/${{ env.ARMV7_NEON_BUILD_PATH }}/ffmpeg/lib"
          for SO in "$NEON_LIB"/lib*_neon.so; do
            [ -f "$SO" ] && cp "$SO" "$JNI_LIBS/"
          done

      - name: Collect build artifacts
        run: |
          set -e
          ABI_SO_DIR="$GITHUB_WORKSPACE/dist/jniLibs/armeabi-v7a"
          mkdir -p "$ABI_SO_DIR"
          cp "$GITHUB_WORKSPACE/android/libs/armeabi-v7a/"*.so "$ABI_SO_DIR/" 2>/dev/null || true

      - name: Upload native .so libraries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ffmpeg-kit-next-9.0.1-android-armeabi-v7a-full-so
          path: dist/jniLibs/
          retention-days: 30
          if-no-files-found: error
